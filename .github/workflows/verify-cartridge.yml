name: Verify Yellow cartridge pins
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch cartkit
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cartkit.py" https://raw.githubusercontent.com/bryanthaboi/gen1recomp/dev/tools/cartkit.py
          python3 "$RUNNER_TEMP/cartkit.py" selftest --quiet
      - name: Verify indexed direct ZIP pins and remaining releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_direct_mod_pins.py . "$RUNNER_TEMP/cartkit.py"
      - name: Strict manifest validation
        run: python3 "$RUNNER_TEMP/cartkit.py" validate . --strict
      - name: Build and inspect candidate bundle (no publish)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          asset="$RUNNER_TEMP/dist/g1r-deluxe-yellow-roddsoft-1.0.2.g1rcart"
          python3 "$RUNNER_TEMP/cartkit.py" pack . -o "$asset"
          python3 scripts/check_release_consistency.py --tag v1.0.2 --bundle "$asset"
          sha256sum "$asset"
